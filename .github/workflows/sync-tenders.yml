name: Sync Tenders

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Russian proxy
        run: |
          echo "Fetching Russian proxy list..."
          PROXY=$(curl -s --max-time 15 \
            "https://api.proxyscrape.com/v3/free-proxy-list/get?request=displayproxies&country=ru&protocol=http&proxy_format=ipport&format=text&timeout=10000&limit=10" \
            | grep -v '^$' | head -1)
          if [ -n "$PROXY" ]; then
            echo "HTTP_PROXY=http://$PROXY" >> $GITHUB_ENV
            echo "HTTPS_PROXY=http://$PROXY" >> $GITHUB_ENV
            echo "Found proxy: $PROXY"
          else
            echo "No proxy found, will try direct connection"
          fi

      - name: Sync tenders from zakupki.gov.ru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-tenders.mjs
