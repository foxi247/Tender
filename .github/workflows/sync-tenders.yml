name: Sync Tenders

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call sync API (all slots)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for slot in $(seq 0 12); do
            echo "Syncing slot $slot..."
            curl -sf "${APP_URL}/api/sync?slot=${slot}&secret=${CRON_SECRET}" || echo "Slot $slot failed"
            sleep 2
          done
